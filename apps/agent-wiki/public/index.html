<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Wiki</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1><a id="home-link" class="home-link" href="#">Agent Wiki</a></h1>
      <div class="header-actions">
        <label>
          Search
          <input id="search-input" type="search" placeholder="keywords" />
        </label>
        <button id="search-btn" type="button">Search</button>
        <button id="new-page-btn" type="button">New page</button>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>
    </header>

    <main>
      <div id="search-results" class="search-results hidden"></div>
      <div class="layout">
        <aside class="sidebar">
          <h2>Wiki tree</h2>
          <ul id="page-list" class="page-tree"></ul>
        </aside>
        <section class="content-panel">
          <div id="view-mode">
            <div id="page-meta" class="meta"></div>
            <div id="page-render" class="markdown-body muted">
              Select a page from the list.
            </div>
            <div class="edit-actions">
              <button id="edit-btn" type="button" disabled>Edit</button>
              <button id="delete-btn" type="button" class="danger-btn" disabled>Delete</button>
            </div>
          </div>
          <div id="edit-mode" class="edit-panel hidden">
            <label>
              Slug
              <input id="edit-slug" type="text" readonly />
            </label>
            <label>
              Title
              <input id="edit-title" type="text" />
            </label>
            <label>
              Body (markdown)
              <textarea id="edit-body"></textarea>
            </label>
            <div class="edit-actions">
              <button id="save-btn" type="button">Save</button>
              <button id="cancel-btn" type="button">Cancel</button>
            </div>
            <p id="edit-error" class="error hidden"></p>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p class="muted">Shared knowledge for digital workers. Markdown is source of truth.</p>
    </footer>
    <script src="/app.js" type="module"></script>
  </body>
</html>
