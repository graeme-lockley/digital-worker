name: dev-workstation-template

services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      SQLD_NODE: primary
    volumes:
      - libsql-data:/var/lib/sqld
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  agent-register:
    build:
      context: .
      dockerfile: infra/dev-workstation/Dockerfile.agent-register
    ports:
      - "3001:3001"
    depends_on:
      libsql:
        condition: service_healthy
    command:
      - node
      - dist/index.js
      - --host
      - "0.0.0.0"
      - --port
      - "3001"
      - --heartbeat-interval
      - "15000"
      - --heartbeat-timeout
      - "5000"
      - --db-url
      - http://libsql:8080
    environment:
      LIBSQL_URL: http://libsql:8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  agent-core-fred:
    build:
      context: .
      dockerfile: infra/dev-workstation/Dockerfile.agent-core
    entrypoint: ["/app/infra/dev-workstation/agent-core-entrypoint.sh"]
    ports:
      - "3000:3000"
    depends_on:
      agent-register:
        condition: service_healthy
    command:
      - node
      - dist/index.js
      - --host
      - "0.0.0.0"
      - --port
      - "3000"
      - --register-url
      - http://agent-register:3001
      - --endpoint-url
      - http://agent-core-fred:3000
      - --agent-id
      - dev-workstation-agent-core-fred
      - --agent-name
      - Fred
      - --workspace-dir
      - /app/workspace/Fred
      - --provider
      - deepseek
      - --model
      - deepseek-v4-flash
      - --skills
      - skill-authoring
      - --memory-flush-soft-threshold-tokens
      - "4000"
      - --memory-flush-min-turns
      - "6"
      - --memory-nudge-interval
      - "10"
      - --memory-bootstrap-budget
      - "8000"
      - --wiki-url
      - http://agent-wiki:3004
    env_file:
      - .env
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OLLAMA_HOST: 127.0.0.1:11434
      AGENT_CORE_HOST: 127.0.0.1
      AGENT_CORE_PORT: "3000"
      WIKI_URL: http://agent-wiki:3004
    volumes:
      - ./workspace/Fred:/app/workspace/Fred
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent-wiki:
    build:
      context: .
      dockerfile: infra/dev-workstation/Dockerfile.agent-wiki
    ports:
      - "3004:3004"
    depends_on:
      agent-core-fred:
        condition: service_healthy
    command:
      - node
      - dist/index.js
      - --host
      - "0.0.0.0"
      - --port
      - "3004"
      - --data-dir
      - /app/data/wiki
    volumes:
      - wiki-data:/app/data/wiki
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  libsql-data:
  wiki-data:
